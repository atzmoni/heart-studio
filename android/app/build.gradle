plugins {
    id "com.android.application"
}

android {
    namespace "com.atzmoni.heartstudio"
    compileSdk 35
    defaultConfig {
        applicationId "com.atzmoni.heartstudio"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // installs straight from the file, no store needed
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs += ["$buildDir/studio-assets"]
}

// The app shows the one-file studio (heart-studio.html, built by tools/build-heart-studio.py), fonts and all included.
def copyStudio = tasks.register("copyStudio", Copy) {
    from(rootProject.file("../heart-studio.html")) { rename { "index.html" } }
    into "$buildDir/studio-assets/studio"
}
preBuild.dependsOn copyStudio

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
