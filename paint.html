<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ציור על הלב</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%96%8C%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; background: #07090d; color: #e9edf3; height: 100%; overscroll-behavior: none; }
  body { padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); box-sizing: border-box; }
  header { display: flex; align-items: center; gap: 8px; font: 700 16px Heebo, system-ui, sans-serif; margin-bottom: 8px; }
  header small { font-weight: 400; opacity: .7; margin-inline-start: auto; }
  #app { max-width: 820px; margin: 0 auto; }
  /* The pad as big as the screen allows, the tools under it; on a phone held sideways, the tools beside it. */
  #app .hp-pad { max-width: min(100%, calc(100dvh - 300px)); min-width: 240px; margin: 0 auto; }
  @media (orientation: landscape) and (max-height: 700px) {
    #app { max-width: none; } #app.hp { flex-direction: row; align-items: flex-start; }
    #app .hp-pad { width: calc(100dvh - 70px); max-width: calc(100dvh - 70px); flex: none; margin: 0; }
    #app .hp-tools { flex: 1; overflow: auto; max-height: calc(100dvh - 70px); }
  }
  #msg { display: none; padding: 10px; border-radius: 10px; background: #3a1420; margin-bottom: 8px; font: 14px Heebo, system-ui, sans-serif; }
</style>
</head>
<body>
<header>🖌️ ציור על הלב <small id="who"></small></header>
<div id="msg"></div>
<div id="app"></div>
<script type="module">
import { Board, Link, mountPainter } from "./heart-paint.js";
const q = new URLSearchParams(location.search), key = q.get("k") || "";
let cid = sessionStorage.getItem("heartpaint.cid");
if (!cid) { cid = "p" + Math.random().toString(36).slice(2, 8); sessionStorage.setItem("heartpaint.cid", cid); }
const board = new Board(768);
const guide = () => "guide.svg?t=" + Date.now();
const link = new Link({
  base: location.origin, key, cid,
  onEvents: (ev, replay) => { if (replay) board.reset(); board.apply(ev); },
  onState: on => { painter.setConnected(on); $("who").textContent = on ? "מחובר לסטודיו" : "מתחבר…"; },
  onGuide: () => painter.setGuide(guide()),
});
const $ = id => document.getElementById(id);
const painter = mountPainter($("app"), { board, cid, guide: guide(), connected: true, emit: ev => link.send(ev) });
fetch("events?k=" + encodeURIComponent(key), { method: "HEAD" }).then(r => {
  if (r.status === 403) { $("msg").style.display = "block"; $("msg").textContent = "הקוד לא נכון. סרקו שוב את קוד ה-QR שבסטודיו (בכרטיסייה 🖌️ ציור)."; }
}).catch(() => {});
link.start();
(function loop() { board.tick(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
